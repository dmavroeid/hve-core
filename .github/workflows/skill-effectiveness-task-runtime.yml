name: Temporary catalog and renderer namespace qualification
on:
  push:
    branches: [automation/skill-effectiveness-validation-20261017]
    paths:
      - .github/validation/skill-effectiveness/task-runtime/**
      - .github/workflows/skill-effectiveness-task-runtime.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  runtime:
    if: github.repository == 'dmavroeid/hve-core' && github.ref == 'refs/heads/automation/skill-effectiveness-validation-20261017'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DO_NOT_TRACK: '1'
      VALLY_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout exact public validation snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
      - name: Restore frozen native host package
        working-directory: .github/skills/hve-core/skill-effectiveness
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - name: Freeze explicit catalog dependencies with verified uv
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task-runtime-evidence/catalog-runtime"
          curl --fail --location --retry 0 --max-time 120 \
            --output "$RUNNER_TEMP/uv.tar.gz" \
            https://github.com/astral-sh/uv/releases/download/0.10.9/uv-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            20d79708222611fa540b5c9ed84f352bcd3937740e51aacc0f8b15b271c57594 \
            "$RUNNER_TEMP/uv.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP" \
            uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx
          uv="$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu/uv"
          "$uv" --version
          "$uv" python install 3.12.3
          project=.github/validation/skill-effectiveness/task-runtime/catalog-runtime
          "$uv" lock --project "$project" --python 3.12.3
          cp "$project/pyproject.toml" "$project/uv.lock" \
            "$RUNNER_TEMP/task-runtime-evidence/catalog-runtime/"
      - name: Derive renderer exception from this engine's default policy
        run: |
          set -euo pipefail
          node --test .github/validation/skill-effectiveness/task-runtime/namespace-profile.test.mjs
          node .github/validation/skill-effectiveness/task-runtime/namespace-profile.mjs \
            "$RUNNER_TEMP/task-runtime-evidence"
      - name: Validate portable dependency metadata
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --include=dev --no-audit --no-fund
          npm run lint:public-dependency-feeds
      - name: Build ephemeral public-package runtime with frozen task dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task-runtime-evidence"
          docker build --platform linux/amd64 --pull --progress plain \
            --iidfile "$RUNNER_TEMP/task-runtime-evidence/image-id" \
            -t "task-runtime:$GITHUB_SHA" \
            -f .github/validation/skill-effectiveness/task-runtime/Dockerfile . \
            2>&1 | tee "$RUNNER_TEMP/task-runtime-evidence/build.log"
          echo "TASK_RUNTIME_IMAGE=$(cat "$RUNNER_TEMP/task-runtime-evidence/image-id")" >> "$GITHUB_ENV"
      - name: Reuse native Docker role compatibility and containment controls
        if: ${{ !cancelled() && env.TASK_RUNTIME_IMAGE != '' }}
        working-directory: .github/skills/hve-core/skill-effectiveness
        run: |
          set -euo pipefail
          unset NODE_OPTIONS NODE_TEST_CONTEXT SKILL_EVAL_INVENTORY_DIR
          node ../../../validation/skill-effectiveness/task-runtime/containment-run.mjs \
            2>&1 | tee "$RUNNER_TEMP/task-runtime-evidence/native-role.log"
      - name: Run trusted task controls in the same protected image
        if: ${{ !cancelled() && env.TASK_RUNTIME_IMAGE != '' }}
        run: |
          set -euo pipefail
          failed=0
          sandbox_passed=0
          for task in catalog notebook sandbox c4; do
            if [[ "$task" == c4 && "$sandbox_passed" != 1 ]]; then
              echo "C4 controls not started: sandbox-positive probe did not pass"
              continue
            fi
            name="task-control-${task}-$GITHUB_RUN_ID"
            security=()
            spec="validation/$task-controls.mjs"
            if [[ "$task" == sandbox || "$task" == c4 ]]; then
              security=(--security-opt "seccomp=$RUNNER_TEMP/task-runtime-evidence/renderer-seccomp.json")
            fi
            if [[ "$task" == sandbox ]]; then
              spec=validation/browser-sandbox.test.mjs
            fi
            docker create --name "$name" --read-only --network none \
              --cap-drop ALL --security-opt no-new-privileges:true --user 1000:1000 \
              --pids-limit 512 --memory 2g --cpus 2 \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=536870912 \
              "${security[@]}" "$TASK_RUNTIME_IMAGE" node --test "$spec" \
              > "$RUNNER_TEMP/task-runtime-evidence/$task-container-id"
            docker inspect "$name" > "$RUNNER_TEMP/task-runtime-evidence/$task-container.json"
            if docker start -a "$name" 2>&1 | tee "$RUNNER_TEMP/task-runtime-evidence/$task-controls.log"; then
              echo "$task: passed"
              if [[ "$task" == sandbox ]]; then
                sandbox_passed=1
                docker cp "$name:/tmp/browser-sandbox.json" "$RUNNER_TEMP/task-runtime-evidence/"
              fi
              if [[ "$task" == c4 ]]; then
                docker cp "$name:/tmp/c4-control-images" "$RUNNER_TEMP/task-runtime-evidence/"
              fi
            else
              echo "$task: failed"
              failed=1
            fi
            docker rm "$name"
          done
          exit "$failed"
      - name: Verify preserved inputs and runtime cleanup
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git diff --exit-code -- .evidence-preflight .github/skills/hve-core/skill-effectiveness
          for task in catalog notebook sandbox c4; do
            name="task-control-${task}-$GITHUB_RUN_ID"
            if docker container inspect "$name" >/dev/null 2>&1; then
              docker rm -f "$name"
              echo "A trusted task container required fallback cleanup"
              exit 1
            fi
          done
          if [ -n "${TASK_RUNTIME_IMAGE:-}" ]; then
            docker image rm "task-runtime:$GITHUB_SHA"
          fi
      - name: Retain model-free runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-task-runtime
          path: |
            ${{ runner.temp }}/task-runtime-evidence/
            ${{ runner.temp }}/containment-d63/safe/summary.json
          retention-days: 7
          if-no-files-found: error
