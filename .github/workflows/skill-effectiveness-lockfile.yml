name: Conservative npm Audit Baseline Draft

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate compatible baseline (${{ matrix.name }})
    if: github.repository == 'dmavroeid/hve-core' && github.ref == 'refs/heads/automation/npm-audit-baseline-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            directory: .
          - name: docs
            directory: docs/docusaurus
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PACKAGE_NAME: ${{ matrix.name }}
      PACKAGE_DIRECTORY: ${{ matrix.directory }}
    steps:
      - name: Checkout the exact draft source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the repository Node.js version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Regenerate only the compatible public resolutions
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/baseline-output"
          mkdir "$output"
          cp "$PACKAGE_DIRECTORY/package.json" "$PACKAGE_DIRECTORY/package-lock.json" "$PACKAGE_DIRECTORY/.npmrc" "$output/"
          (
            cd "$output"
            node --version > NODE-VERSION
            npm --version > NPM-VERSION
            npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org/ --no-audit --no-fund
            node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const before = JSON.parse(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, process.env.PACKAGE_DIRECTORY, "package-lock.json"), "utf8"));
          for (const kind of ["dependencies", "devDependencies"]) {
            assert.deepEqual(lock.packages[""][kind] ?? {}, manifest[kind] ?? {});
            assert.deepEqual(before.packages[""][kind] ?? {}, manifest[kind] ?? {});
          }
          const targets = process.env.PACKAGE_NAME === "root"
            ? { "body-parser": "2.4.0", "fast-uri": "3.1.9", "undici": "7.30.1", "zod": "4.6.7" }
            : { "body-parser": "2.4.0", "fast-uri": "3.1.9", "happy-dom": "21.0.4", "serialize-javascript": "7.1.3", "undici": "8.12.2" };
          for (const [name, version] of Object.entries(targets)) {
            assert.equal(manifest.overrides[name], version);
            const entries = Object.entries(lock.packages).filter(([key]) => key.endsWith(`node_modules/${name}`));
            assert.ok(entries.length > 0, name);
            for (const [, entry] of entries) assert.equal(entry.version, version, name);
          }
          if (process.env.PACKAGE_NAME === "root") {
            for (const name of ["@vscode/vsce", "@azure/identity", "@azure/msal-node"]) {
              const key = `node_modules/${name}`;
              for (const field of ["version", "resolved", "integrity"]) {
                assert.equal(lock.packages[key][field], before.packages[key][field], `${name}: preserve ${field}`);
              }
            }
            assert.equal(manifest.overrides["@azure/msal-node"], undefined);
            assert.equal(manifest.overrides["@azure/identity"], undefined);
          }
          for (const [name, entry] of Object.entries(lock.packages)) {
            if (!name) continue;
            const url = new URL(entry.resolved);
            assert.equal(url.protocol, "https:");
            assert.equal(url.hostname, "registry.npmjs.org");
            assert.equal(url.username, "");
            assert.equal(url.password, "");
            assert.match(entry.integrity, /^sha512-/, name);
          }
          assert.equal(fs.existsSync("node_modules"), false);
          NODE
            sha256sum package.json package-lock.json > SHA256SUMS
          )
          cp "$output/package-lock.json" "$PACKAGE_DIRECTORY/package-lock.json"
          sha256sum package.json docs/docusaurus/package.json audit-ci.json .node-version > "$output/SOURCE-SHA256SUMS"

      - name: Restore the generated dependency set
        run: |
          set -euo pipefail
          cd "$PACKAGE_DIRECTORY"
          npm ci --ignore-scripts --include=dev --no-audit --no-fund

      - name: Check root tooling without publishing or authenticating
        id: root_checks
        if: matrix.name == 'root'
        run: |
          set -euo pipefail
          npm run lint:ts
          npm exec --no -- vsce --version

      - name: Check documentation types, unit tests and production build
        id: docs_checks
        if: matrix.name == 'docs'
        working-directory: docs/docusaurus
        run: |
          set -euo pipefail
          npm run typecheck
          npm exec --no -- jest --runInBand
          npm run test:mermaid-a11y
          npm run build

      - name: Validate canonical dependency sources
        run: npm run lint:public-dependency-feeds

      - name: Record the real audit result without exceptions
        id: audit
        run: |
          set -euo pipefail
          cd "$PACKAGE_DIRECTORY"
          npm audit --package-lock-only --ignore-scripts --audit-level=low --json > "$RUNNER_TEMP/baseline-output/audit.json"

      - name: Record exact source and check outcomes
        if: always()
        env:
          ROOT_CHECKS: ${{ steps.root_checks.outcome }}
          DOCS_CHECKS: ${{ steps.docs_checks.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const output = path.join(process.env.RUNNER_TEMP, "baseline-output");
          const receipt = {
            repository: process.env.GITHUB_REPOSITORY,
            sourceCommit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            package: process.env.PACKAGE_NAME,
            node: process.version,
            npm: fs.readFileSync(path.join(output, "NPM-VERSION"), "utf8").trim(),
            rootChecks: process.env.ROOT_CHECKS,
            docsChecks: process.env.DOCS_CHECKS,
            audit: process.env.AUDIT_OUTCOME
          };
          fs.writeFileSync(path.join(output, "receipt.json"), JSON.stringify(receipt, null, 2) + "\n");
          NODE

      - name: Upload generated locks and unmodified audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-baseline-${{ matrix.name }}
          path: ${{ runner.temp }}/baseline-output/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 7
