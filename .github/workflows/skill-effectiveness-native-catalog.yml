name: Temporary native catalog grading qualification
on:
  push:
    branches: [automation/skill-effectiveness-validation-20261017]
    paths:
      - .github/validation/skill-effectiveness/native-catalog/**
      - .github/workflows/skill-effectiveness-native-catalog.yml
      - .evidence-preflight/grading/detailed-data-catalog/**
      - .evidence-preflight/evals/detailed-data-catalog.grade.eval.yaml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  native-catalog:
    if: github.repository == 'dmavroeid/hve-core' && github.ref == 'refs/heads/automation/skill-effectiveness-validation-20261017'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DO_NOT_TRACK: '1'
      VALLY_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout exact approved public snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
      - name: Check trusted catalog adapter startup classification
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-catalog-qualification/safe"
          node --test .github/validation/skill-effectiveness/native-catalog/catalog-adapter.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/native-catalog-qualification/safe/adapter-tests.log"
      - name: Restore frozen native CLI
        working-directory: .github/skills/hve-core/skill-effectiveness
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund
      - name: Build the previously qualified frozen task image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-catalog-qualification/safe"
          docker build --platform linux/amd64 --pull --progress plain \
            --iidfile "$RUNNER_TEMP/native-catalog-qualification/safe/base-image-id" \
            -t "native-catalog-base:$GITHUB_SHA" \
            -f .github/validation/skill-effectiveness/task-runtime/Dockerfile . \
            2>&1 | tee "$RUNNER_TEMP/native-catalog-qualification/safe/build.log"
          echo "CATALOG_BASE_IMAGE=$(cat "$RUNNER_TEMP/native-catalog-qualification/safe/base-image-id")" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --progress plain \
            --build-arg "TASK_BASE_IMAGE=native-catalog-base:$GITHUB_SHA" \
            --iidfile "$RUNNER_TEMP/native-catalog-qualification/safe/image-id" \
            -t "native-catalog:$GITHUB_SHA" \
            -f .github/validation/skill-effectiveness/native-catalog/Dockerfile . \
            2>&1 | tee "$RUNNER_TEMP/native-catalog-qualification/safe/grade-image-build.log"
          echo "TASK_RUNTIME_IMAGE=$(cat "$RUNNER_TEMP/native-catalog-qualification/safe/image-id")" >> "$GITHUB_ENV"
      - name: Exercise native catalog controls and approved synthetic grade-output storage
        working-directory: .github/skills/hve-core/skill-effectiveness
        run: |
          set -euo pipefail
          unset NODE_OPTIONS NODE_TEST_CONTEXT SKILL_EVAL_INVENTORY_DIR
          node --test ../../../validation/skill-effectiveness/native-catalog/native-catalog.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/native-catalog-qualification/safe/tests.log"
      - name: Verify preservation and complete owned resource cleanup
        if: ${{ always() }}
        run: |
          set -euo pipefail
          failed=0
          git diff --exit-code -- .evidence-preflight .github/skills/hve-core/skill-effectiveness \
            .github/validation/skill-effectiveness/task-runtime || failed=1
          if [[ -n "${TASK_RUNTIME_IMAGE:-}" ]]; then
            ids=$(docker ps -aq --filter "ancestor=$TASK_RUNTIME_IMAGE")
            if [[ -n "$ids" ]]; then
              readarray -t containers <<< "$ids"
              docker rm -f "${containers[@]}" || failed=1
              echo "Native lifecycle required fallback container cleanup"
              failed=1
            fi
            docker image rm "native-catalog:$GITHUB_SHA" || failed=1
          fi
          if [[ -n "${CATALOG_BASE_IMAGE:-}" ]]; then
            ids=$(docker ps -aq --filter "ancestor=$CATALOG_BASE_IMAGE")
            if [[ -n "$ids" ]]; then
              readarray -t containers <<< "$ids"
              docker rm -f "${containers[@]}" || failed=1
              echo "Base-image probe required fallback container cleanup"
              failed=1
            fi
            docker image rm "native-catalog-base:$GITHUB_SHA" || failed=1
          fi
          exit "$failed"
      - name: Preserve raw native records and test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-catalog-qualification
          path: ${{ runner.temp }}/native-catalog-qualification/safe/
          retention-days: 7
          if-no-files-found: error
