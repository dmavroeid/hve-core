name: Temporary synthetic candidate credential boundary
on:
  push:
    branches: [automation/skill-effectiveness-validation-20261017]
    paths:
      - .github/validation/skill-effectiveness/credential-boundary/**
      - .github/workflows/skill-effectiveness-credential-boundary.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  credential-boundary:
    if: github.repository == 'dmavroeid/hve-core' && github.ref == 'refs/heads/automation/skill-effectiveness-validation-20261017'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact approved synthetic test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the qualified image and synthetic test layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/credential-boundary"
          docker build --platform linux/amd64 --pull \
            -t "credential-base:$GITHUB_SHA" \
            -f .github/validation/skill-effectiveness/task-runtime/Dockerfile . \
            > "$RUNNER_TEMP/credential-boundary/build.log" 2>&1
          docker build --platform linux/amd64 \
            --build-arg "TASK_BASE_IMAGE=credential-base:$GITHUB_SHA" \
            -t "credential-test:$GITHUB_SHA" \
            -f .github/validation/skill-effectiveness/credential-boundary/Dockerfile . \
            >> "$RUNNER_TEMP/credential-boundary/build.log" 2>&1
      - name: Measure offered-tool credential visibility without model calls
        shell: bash
        run: |
          set -euo pipefail
          name="credential-boundary-$GITHUB_RUN_ID"
          docker create --name "$name" --read-only --network none --pid private \
            --cap-drop ALL --security-opt no-new-privileges:true --user 1000:1000 \
            --pids-limit 128 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=67108864 \
            --env COPILOT_GITHUB_TOKEN=HVE_SYNTHETIC_CREDENTIAL_CANARY_NOT_A_REAL_TOKEN \
            "credential-test:$GITHUB_SHA" \
            node --test validation/credential-boundary.test.mjs
          docker inspect "$name" > "$RUNNER_TEMP/credential-boundary/container.json"
          node -e '
            const fs=require("node:fs"),a=require("node:assert/strict");
            const [c]=JSON.parse(fs.readFileSync(process.argv[1]));
            a.equal(c.Config.User,"1000:1000");a.equal(c.HostConfig.ReadonlyRootfs,true);
            a.equal(c.HostConfig.NetworkMode,"none");a.equal(c.HostConfig.PidMode,"private");
            a.deepEqual(c.HostConfig.CapDrop,["ALL"]);a.equal(c.HostConfig.CapAdd?.length??0,0);
            a.ok(c.HostConfig.SecurityOpt.includes("no-new-privileges:true"));
            a.equal(c.HostConfig.PidsLimit,128);a.equal(c.HostConfig.Memory,536870912);
            a.equal(c.HostConfig.NanoCpus,1000000000);
            a.ok(c.Mounts.every(m=>m.Type!=="bind"));
          ' "$RUNNER_TEMP/credential-boundary/container.json"
          docker start -a "$name" 2>&1 | tee "$RUNNER_TEMP/credential-boundary/tests.log"
      - name: Preserve source and remove owned runtime resources
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          name="credential-boundary-$GITHUB_RUN_ID"
          if docker container inspect "$name" > /dev/null 2>&1; then
            docker inspect "$name" > "$RUNNER_TEMP/credential-boundary/final-container.json"
            docker rm -f "$name" || failed=1
          fi
          for tag in "credential-test:$GITHUB_SHA" "credential-base:$GITHUB_SHA"; do
            if docker image inspect "$tag" > /dev/null 2>&1; then
              docker image rm "$tag" || failed=1
            fi
          done
          git diff --exit-code -- .evidence-preflight .github/skills/hve-core/skill-effectiveness || failed=1
          exit "$failed"
      - name: Preserve measured boundary evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synthetic-credential-boundary
          path: ${{ runner.temp }}/credential-boundary/
          retention-days: 7
          if-no-files-found: error
