name: Temporary skill-effectiveness frozen package regression
on:
  push:
    branches: [automation/skill-effectiveness-validation-20261017]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'dmavroeid/hve-core' && github.ref == 'refs/heads/automation/skill-effectiveness-validation-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .github/skills/hve-core/skill-effectiveness
    env:
      DO_NOT_TRACK: '1'
      VALLY_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
      - name: Restore frozen host tooling
        timeout-minutes: 4
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --include=dev --no-audit --no-fund --fetch-retries=0 --fetch-timeout=60000
      - name: Verify licensing and ordinary model-free package suite
        timeout-minutes: 8
        run: |
          set -euo pipefail
          unset SKILL_EFFECTIVENESS_NATIVE_PREFLIGHT SKILL_EVAL_INVENTORY_DIR NODE_OPTIONS NODE_TEST_CONTEXT
          npm test
          git diff --exit-code -- .
      - name: Prepare current-code evidence lock without new resolution
        working-directory: .evidence-preflight
        timeout-minutes: 2
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --offline --no-audit --no-fund
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const a=JSON.parse(fs.readFileSync("package.json")); const b=JSON.parse(fs.readFileSync("../.github/skills/hve-core/skill-effectiveness/package.json")); assert.deepEqual(a.devDependencies,b.devDependencies); assert.deepEqual(a.overrides,b.overrides);'
          npm ci --ignore-scripts --include=dev --no-audit --no-fund --fetch-retries=0 --fetch-timeout=60000
      - name: Validate preserved task packages without model calls
        working-directory: .evidence-preflight
        timeout-minutes: 6
        run: |
          set -euo pipefail
          unset SKILL_EFFECTIVENESS_NATIVE_PREFLIGHT SKILL_EVAL_INVENTORY_DIR NODE_OPTIONS NODE_TEST_CONTEXT
          npm test 2>&1 | tee evidence-validation.log
      - name: Inspect existing task-checker Python prerequisites
        working-directory: .evidence-preflight
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 -c 'import importlib.util as u, importlib.metadata as m, json, platform; packages={"yaml":"PyYAML","jsonschema":"jsonschema","nbformat":"nbformat","nbconvert":"nbconvert","ipykernel":"ipykernel","PIL":"Pillow","matplotlib":"matplotlib","pandas":"pandas"}; print(json.dumps({"python":platform.python_version(),"packages":{package: m.version(package) if u.find_spec(module) else None for module,package in packages.items()}},indent=2))' | tee task-runtime-prerequisites.json
      - name: Qualify catalog controls through the real checker and native grader
        working-directory: .evidence-preflight
        timeout-minutes: 3
        env:
          CATALOG_PYTHON: python3
        run: |
          set -euo pipefail
          unset SKILL_EFFECTIVENESS_NATIVE_PREFLIGHT SKILL_EVAL_INVENTORY_DIR NODE_OPTIONS NODE_TEST_CONTEXT
          node --test validation/catalog-controls.mjs 2>&1 | tee catalog-controls.log
      - name: Retain generated lock and model-free validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-preflight
          path: |
            .evidence-preflight/package-lock.json
            .evidence-preflight/evidence-validation.log
            .evidence-preflight/task-runtime-prerequisites.json
            .evidence-preflight/catalog-controls.log
          retention-days: 7
          if-no-files-found: error
      - name: Set up exact uv for isolated notebook controls
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Restore frozen isolated public notebook prerequisites
        working-directory: .evidence-preflight/validation/python-runtime
        timeout-minutes: 4
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          uv sync --frozen --python "$(command -v python3)"
          uv run --frozen python -m ipykernel install --prefix "$PWD/.venv" --name hve-simplified-pilot --display-name "Trusted notebook control"
          uv run --frozen python -c 'import importlib.metadata as m, json, platform; print(json.dumps({"python":platform.python_version(),"packages":{p:m.version(p) for p in ["nbformat","nbconvert","ipykernel","Pillow","matplotlib","pandas","numpy","seaborn"]}},indent=2))' | tee notebook-runtime.json
      - name: Qualify notebook execution through original checkers and native graders
        working-directory: .evidence-preflight
        timeout-minutes: 6
        run: |
          set -euo pipefail
          unset SKILL_EFFECTIVENESS_NATIVE_PREFLIGHT SKILL_EVAL_INVENTORY_DIR NODE_OPTIONS NODE_TEST_CONTEXT
          source validation/python-runtime/.venv/bin/activate
          export QUEUE_DELAY_NOTEBOOK_PYTHON="$PWD/validation/python-runtime/.venv/bin/python"
          export QUEUE_DELAY_NOTEBOOK_KERNEL=hve-simplified-pilot
          export MPLBACKEND=Agg
          node --test validation/notebook-controls.mjs 2>&1 | tee notebook-controls.log
      - name: Retain isolated notebook lock and control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: notebook-controls
          path: |
            .evidence-preflight/validation/python-runtime/pyproject.toml
            .evidence-preflight/validation/python-runtime/uv.lock
            .evidence-preflight/validation/python-runtime/notebook-runtime.json
            .evidence-preflight/notebook-controls.log
          retention-days: 7
          if-no-files-found: error
