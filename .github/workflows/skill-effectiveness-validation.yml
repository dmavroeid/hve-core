                try {
                  buffer += chunk; ensure(Buffer.byteLength(buffer) <= 65536, "event-limit");
                  let end;
                  while ((end = buffer.indexOf("\n")) >= 0) {
                    const event = JSON.parse(buffer.slice(0, end)); buffer = buffer.slice(end + 1);
                    ensure(++count <= 128 && event.Type === "container" && typeof event.Action === "string" && hex(event.Actor?.ID), "event-limit");
                    if (!state.ready) {
                      if (event.Actor.ID === anchor && event.Action === "destroy") { clearTimeout(timer); state.ready = true; persist(); }
                      continue;
                    }
                    if (previous.has(event.Actor.ID)) continue;
                    if (event.Action === "create") {
                      const fact = inspect(event.Actor.ID);
                      for (const mount of fact.mounts) if (mount.Type === "bind") ensure(realpathSync(mount.Source) === mount.Source, "foreign-source");
                      fact.canonical = true; validateFact(fact, dir);
                      ensure(state.facts.length < 3 && !state.facts.some(f => f.id === fact.id), "invalid-topology");
                      const volumes = fact.mounts.filter(m => m.Type === "volume").map(m => m.Name);
                      const missing = volumes.filter(name => !volumeCache.has(name));
                      ensure(volumeCache.size + missing.length <= 3, "invalid-volumes");
                      if (missing.length) {
                        const rows = docker(["volume", "inspect", "--format", '{"name":{{json .Name}},"labels":{{json .Labels}}}', ...missing]).split("\n").map(JSON.parse);
                        ensure(rows.length === missing.length && new Set(rows.map(v => v.name)).size === missing.length &&
                          rows.every(v => missing.includes(v.name)), "invalid-volumes");
                        for (const volume of rows) volumeCache.set(volume.name, volume);
                      }
                      fact.volumes = volumes.map(name => volumeCache.get(name));
                      state.facts.push(fact);
                    } else {
                      const fact = state.facts.find(f => f.id === event.Actor.ID);
                      ensure(fact, "unobserved-container");
                      if (event.Action?.startsWith("exec_create") && fact.labels["com.docker.compose.service"] === "grade") {
