name: Temporary protected-input native grading probe
on:
  push:
    branches: [automation/skill-effectiveness-validation-20261017]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'dmavroeid/hve-core' && github.ref == 'refs/heads/automation/skill-effectiveness-validation-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .github/skills/hve-core/skill-effectiveness
    env:
      DO_NOT_TRACK: '1'
      VALLY_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout exact snapshot
        timeout-minutes: 1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Node
        timeout-minutes: 1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
      - name: Guard source and restore frozen host package
        timeout-minutes: 1
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/protected-input"
          mkdir "$root" "$root/raw" "$root/safe" "$root/context" "$root/home" 2>/dev/null || {
            printf '%s\n' '::error::Protected-input initialization failed'; exit 1;
          }
          export SKILL="$PWD" PROBE_ROOT="$root"
          cat > "$root/probe.mjs" 2>/dev/null <<'NODE'
          import assert from "node:assert/strict";
          import { createHash, randomUUID } from "node:crypto";
          import { execFile, execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync, copyFileSync, mkdirSync, readdirSync, lstatSync, realpathSync, existsSync, rmSync } from "node:fs";
          import http from "node:http";
          import path from "node:path";
          import { createRequire } from "node:module";
          const root = process.env.PROBE_ROOT;
          const names = ["positive", "wrong-digest", "modified-checker"];
          const scope = "Three synthetic native grading mechanics cases; not task/arm or full readonly acceptance";
          const uuid = value => typeof value === "string" && /^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/.test(value);
          const hex = value => typeof value === "string" && /^[a-f0-9]{64}$/.test(value);
          const failureKinds = ["resource-inspection", "role-cleanup", "case-cleanup", "source-preservation", "image-cleanup", "projection", "scratch-cleanup"];
          const keys = ["checkerAuthenticated", "checkerBodyEntered", "checkerWriteDenied", "submissionWriteDenied", "submissionMatches", "workspaceWritable"];
          const digest = "34658b61a46287ef1d01f4fdf00e1db371b0bb63fb61af96465c7577925ccc79";
          const hash = bytes => createHash("sha256").update(bytes).digest("hex");
          const ensure = (ok, reason) => { if (!ok) throw new Error(reason); };
          const bounded = (file, limit = 1048576) => {
            ensure(realpathSync(file) === file && lstatSync(file).isFile() && lstatSync(file).size <= limit, "unsafe-file");
            const bytes = readFileSync(file); ensure(bytes.length <= limit, "unsafe-file"); return bytes;
          };
          const read = file => JSON.parse(bounded(file).toString("utf8"));
          const save = (file, value, limit = 1048576) => {
            const text = JSON.stringify(value); ensure(Buffer.byteLength(text) <= limit, "projection-limit");
            writeFileSync(file, text, { mode: 0o600 });
          };
          const expected = {
            "package.json": "58f696269135e8dc8ab5ad1fedc8cad2f917095c4a8b021708c4a4775e618769",
            "package-lock.json": "b9c750fbb43bcf37350da9f62722d737380f0e271a78210be6ad64cd63862da2",
            "vally-0.19.Dockerfile": "e3b0007c8d090c0013cfa7b26e3c5d600d585e67309a35433e5bbe26858153e8",
            "protected-input-check.mjs": "34658b61a46287ef1d01f4fdf00e1db371b0bb63fb61af96465c7577925ccc79",
            "protected-input-probe.eval.yaml": "8a9bd08040be97f466db545be7d418a5f03b06c7b69b2b9068c337911b51999f",
          };
          const pins = { core: "0.19.0", cli: "0.19.0", sdk: "1.0.15", runtime: "1.0.89", sharp: "0.35.5", yaml: "2.9.1" };
          export function guard() {
            const files = execFileSync("git", ["ls-tree", "-r", "--name-only", "HEAD", "--", "."], { encoding: "utf8", timeout: 2000, maxBuffer: 65536 }).trim().split("\n").sort();
            assert.equal(files.length, 23);
            const inventory = files.map(file => `${file} ${hash(readFileSync(file, "utf8").replace(/\r\n/g, "\n"))}`).join("\n") + "\n";
            assert.equal(hash(inventory), "c34a92e94238261370729e6f25d37fcbff97a579df106f7927d9830fe3f61da9");
            ensure(!existsSync("node_modules"), "unexpected-package-tree");
            for (const [name, digest] of Object.entries(expected)) {
              const source = name.startsWith("package") ? name : path.join(process.env.GITHUB_WORKSPACE, ".github/validation/skill-effectiveness", name);
              assert.equal(hash(readFileSync(source)), digest);
              copyFileSync(source, name.startsWith("protected-input-") ? path.join(root, name)
                : path.join(root, "context", name === "vally-0.19.Dockerfile" ? "Dockerfile" : name));
            }
            assert.deepEqual(readdirSync(path.join(root, "context")).sort(), ["Dockerfile", "package-lock.json", "package.json"]);
            const context = ["Dockerfile", "package.json", "package-lock.json"].map(name =>
              `${hash(readFileSync(path.join(root, "context", name)))}  ${name}\n`).join("");
            assert.equal(hash(context), "ebb1bcbf0e99ed60f4aaf93a2ffaaa49461a92142ea02aa16f86339ae54d941b");
            save(path.join(root, "safe/identities.json"), {
              snapshot: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8", timeout: 2000, maxBuffer: 65536 }).trim(),
              workflow: hash(readFileSync(path.join(process.env.GITHUB_WORKSPACE, ".github/workflows/skill-effectiveness-validation.yml"))),
              inventory: hash(inventory), context: hash(context), inputs: expected, pinnedVersions: pins,
            });
          }
          export async function setup() {
            const file = path.join(root, "safe/summary.json"), summary = emptySummary();
            save(file, summary, 16384);
            for (const stage of ["guard", "restore"]) {
              summary.setup = { stage, exit: null, reason: "unavailable" }; save(file, summary, 16384);
              const command = stage === "guard" ? [process.execPath, process.argv[1], "guard"] : ["npm", "ci", "--ignore-scripts", "--include=dev",
                "--registry=https://registry.npmjs.org/", "--fetch-retries=0", "--fetch-timeout=30000", "--no-audit", "--no-fund"];
              const { error, stdout, stderr } = await new Promise(resolve => execFile("timeout",
                ["--signal=TERM", "--kill-after=5s", stage === "guard" ? "3s" : "45s", ...command],
                { encoding: "buffer", maxBuffer: 1048576 }, (error, stdout, stderr) => resolve({ error, stdout, stderr })));
              for (const [name, bytes] of [["out", stdout], ["err", stderr]]) writeFileSync(path.join(root, "raw", `${stage}.${name}`), bytes.subarray(0, 1048576));
              const exit = error ? Number.isInteger(error.code) && error.code >= 0 && error.code <= 255 ? error.code : null : 0;
              const reason = !error ? "passed" : error.code === "ERR_CHILD_PROCESS_STDIO_MAXBUFFER" ? "output-limit" : exit === 124 ? "timeout" : "command-failed";
              summary.setup = { stage, exit, reason }; summary.status = error ? "failed-or-unavailable" : "incomplete";
              save(file, summary, 16384); ensure(!error, "setup-failed");
            }
          }
          const docker = args => execFileSync("docker", args, {
            env: { PATH: process.env.PATH, HOME: path.join(root, "home") }, encoding: "utf8", timeout: 5000, maxBuffer: 65536,
          }).trim();
          export function makeInput(id, workspace) {
            const tokenUsage = { inputTokens: 0, outputTokens: 0, totalTokens: 0, cacheReadTokens: 0, cacheWriteTokens: 0, callCount: 0, byModel: {} };
            return { status: "success", gradeResult: null, trajectory: {
              id, stimulus: { name: "protected-input", prompt: "Synthetic grading input only; never send to a model." }, events: [], output: "", workDir: workspace,
              metrics: { tokenUsage, toolCallCount: 0, toolCallBreakdown: {}, simulatedToolCallCount: 0, skillActivationCount: 0,
                skillActivationBreakdown: {}, turnCount: 0, wallTimeMs: 0, errorCount: 0 },
              metadata: { model: "synthetic-none", executor: "synthetic-none", sessionID: `synthetic-${id}`, skillsLoaded: [] },
            } };
          }
          export function caseBytes(name, source, checker) {
            ensure(names.includes(name) && hash(checker) === digest, "invalid-case");
            ensure(source.split(digest).length === 2, "invalid-eval");
            return { yaml: name === "wrong-digest" ? source.replace(digest, "0".repeat(64)) : source,
              checker: name === "modified-checker" ? Buffer.concat([checker, Buffer.from("\n// Synthetic integrity-negative mutation.\n")]) : checker };
          }
          export function prepare() {
            const summary = safeSummary(read(path.join(root, "safe/summary.json")));
            ensure(summary.setup.reason === "passed" && summary.setup.stage === "restore", "setup-incomplete");
            const { parse } = createRequire(path.join(process.env.SKILL, "package.json"))("yaml");
            ensure(bounded(path.join(root, "raw/roles-ok")).toString() === "passed\n", "missing-role-checks");
            const image = JSON.parse(docker(["image", "inspect", "--format", '{"id":{{json .Id}},"os":{{json .Os}},"architecture":{{json .Architecture}},"user":{{json .Config.User}}}', process.env.IMAGE]));
            ensure(image.id === process.env.IMAGE && image.os === "linux" && image.architecture === "amd64" && image.user === "1000:1000", "invalid-image");
            const source = bounded(path.join(root, "protected-input-probe.eval.yaml")).toString("utf8");
            ensure(hash(source) === "8a9bd08040be97f466db545be7d418a5f03b06c7b69b2b9068c337911b51999f", "invalid-eval-source");
            const checker = bounded(path.join(root, "protected-input-check.mjs"));
            mkdirSync(path.join(root, "cases"));
            for (const name of names) {
              const dir = path.join(root, "cases", name); mkdirSync(dir);
              for (const child of ["workspace", "assets", "artifact", "tmp", "home"]) mkdirSync(path.join(dir, child));
              const bytes = caseBytes(name, source, checker), id = randomUUID();
              writeFileSync(path.join(dir, "eval.yaml"), bytes.yaml); writeFileSync(path.join(dir, "assets/protected-input-check.mjs"), bytes.checker);
              writeFileSync(path.join(dir, "artifact/result.txt"), "Synthetic protected-input artifact.\n");
              save(path.join(dir, "input.json"), makeInput(id, path.join(dir, "workspace")));
              const spec = parse(bytes.yaml), args = spec.stimuli[0].graders[0].config.args;
              ensure(args.at(-1) === (name === "wrong-digest" ? "0".repeat(64) : digest), "invalid-eval");
              save(path.join(dir, "case.json"), { name, id, args, inputHash: hash(bounded(path.join(dir, "input.json"))),
                evalHash: hash(bytes.yaml), checkerHash: hash(bytes.checker) });
            }
            save(path.join(root, "safe/summary.json"), { ...summary, image: process.env.IMAGE, compatibilityChecks: true }, 16384);
          }
          const inspect = id => {
            ensure(/^[a-f0-9]{64}$/.test(id), "invalid-container");
            const format = '{"id":{{json .Id}},"image":{{json .Image}},"user":{{json .Config.User}},"mounts":{{json .Mounts}},"tmpfs":{{json .HostConfig.Tmpfs}},"network":{{json .HostConfig.NetworkMode}},"privileged":{{json .HostConfig.Privileged}},"labels":{{json .Config.Labels}}}';
            const fact = JSON.parse(docker(["inspect", "--format", format, id]));
            ensure(fact.id === id, "invalid-container"); return fact;
          };
          export function validateFact(fact, dir) {
            ensure(hex(fact.id) && fact.image === process.env.IMAGE && fact.network === "none" && fact.privileged === false, "invalid-container");
            const labels = fact.labels, service = labels["com.docker.compose.service"] ?? null;
            ensure(Array.isArray(fact.mounts) && fact.mounts.length <= 8 &&
              new Set(fact.mounts.map(m => m.Destination)).size === fact.mounts.length, "invalid-mounts");
            for (const mount of fact.mounts) {
              ensure(typeof mount.RW === "boolean" && ["bind", "volume"].includes(mount.Type), "invalid-mounts");
              if (mount.Type === "bind") ensure(fact.canonical === true && typeof mount.Source === "string" &&
                mount.Source.startsWith(`${dir}/`) && path.resolve(mount.Source) === mount.Source, "foreign-source");
              if (mount.Type === "volume") ensure(/^vally-[a-z-]+-[a-f0-9]{32}$/.test(mount.Name), "invalid-volume");
            }
            if (service === null) {
              ensure(labels["com.microsoft.vally.kind"] === "check" && labels["com.microsoft.vally.trial"] === "check-grade" &&
                labels["com.microsoft.vally.role"] === "grade" &&
                /^[a-f0-9]{32}$/.test(labels["com.microsoft.vally.owner"]) && fact.user === "1000:1000", "invalid-check");
              ensure(fact.mounts.length === 2 && fact.mounts.every(m => m.Type === "bind" &&
                m.Source.startsWith(`${dir}/tmp/vally-docker-check-`) &&
                ((m.Destination === "/run/vally/control" && !m.RW) || (m.Destination === "/ipc-grade" && m.RW))), "invalid-check");
            } else {
              ensure(["grade-init", "grade"].includes(service) && /^vally-[a-f0-9]{8}$/.test(labels["com.docker.compose.project"]) &&
                labels["com.docker.compose.project.working_dir"] === dir, "invalid-project");
              const file = labels["com.docker.compose.project.config_files"];
              ensure(typeof file === "string" && file.startsWith(`${dir}/tmp/`) && !file.includes(",") &&
                path.basename(file) === "docker-compose.grade.generated.yml" && path.resolve(file) === file, "invalid-project");
              ensure(fact.user === (service === "grade" ? "1000:1000" : "0:0"), "invalid-user");
            }
            const tmpfs = fact.tmpfs ?? {};
            ensure(!Array.isArray(tmpfs) && typeof tmpfs === "object", "invalid-tmpfs");
            ensure(service === "grade" ? Object.keys(tmpfs).length === 1 && typeof tmpfs["/tmp/vally-home"] === "string" &&
              tmpfs["/tmp/vally-home"].split(",").sort().join() === ["rw", "mode=0700", "uid=1000", "gid=1000"].sort().join()
              : Object.keys(tmpfs).length === 0, "invalid-tmpfs");
            return service ?? "check";
          }
          export function correlate(facts, request, config, dir) {
            ensure(facts.length === 3 && new Set(facts.map(f => f.id)).size === 3, "invalid-topology");
            const byRole = new Map(facts.map(f => [validateFact(f, dir), f]));
            ensure(byRole.size === 3 && byRole.has("check"), "invalid-topology");
            const grade = byRole.get("grade"), init = byRole.get("grade-init");
            ensure(grade && init && grade.labels["com.docker.compose.project"] === init.labels["com.docker.compose.project"], "invalid-topology");
            ensure(request?.id === config.id && request.workDir === "/workspace", "invalid-request");
            const refs = grade.mounts.filter(m => m.Type === "volume" && m.Destination.startsWith("/var/lib/vally-host/"));
            ensure(refs.length === 2 && refs.every(m => !m.RW), "writable-reference");
            ensure(grade.mounts.length === 5 && init.mounts.length === 6, "invalid-topology");
            const workspace = grade.mounts.find(m => m.Destination === "/workspace");
            ensure(workspace?.Type === "volume" && workspace.RW, "invalid-workspace");
            for (const [target, rw] of [["/run/vally/control", false], ["/ipc-grade", true]]) {
              ensure(grade.mounts.some(m => m.Type === "bind" && m.Destination === target && m.RW === rw &&
                m.Source.startsWith(`${dir}/tmp/vally-docker-grade-`)), "invalid-channel");
            }
            const binds = init.mounts.filter(m => m.Type === "bind");
            ensure(binds.length === 3 && binds.every(m => !m.RW) &&
              binds.some(m => m.Source === `${dir}/workspace` && m.Destination === "/source-workspace"), "invalid-sources");
            for (const [field, source] of [["assetsDir", "assets"], ["artifactDir", "artifact"]]) {
              const ref = refs.find(m => m.Destination === request[field]);
              ensure(ref && /^\/var\/lib\/vally-host\/\d+$/.test(ref.Destination), "invalid-request");
              ensure(binds.some(m => m.Source === `${dir}/${source}` &&
                /^\/var\/lib\/vally-grade-sources\/[01]$/.test(m.Destination)), "invalid-sources");
            }
            ensure(new Set([request.assetsDir, request.artifactDir, request.workDir]).size === 3, "invalid-request");
            const volumes = grade.mounts.filter(m => m.Type === "volume");
            ensure(volumes.length === 3 && new Set(volumes.map(m => m.Name)).size === 3 && init.mounts.filter(m => m.Type === "volume").every(m => m.RW &&
              volumes.some(v => v.Name === m.Name && v.Destination === m.Destination)), "invalid-volumes");
            const owner = byRole.get("check").labels["com.microsoft.vally.owner"];
            for (const fact of [init, grade]) {
              ensure(Array.isArray(fact.volumes) && fact.volumes.length === 3 && new Set(fact.volumes.map(v => v.name)).size === 3, "invalid-volumes");
              for (const mount of volumes) ensure(fact.volumes.some(v => v.name === mount.Name &&
                v.labels["com.microsoft.vally.owner"] === owner && v.labels["com.microsoft.vally.trial"] === `grade-${config.id}` &&
                v.labels["com.microsoft.vally.kind"] === (mount.Destination === "/workspace" ? "grade-workspace" : "grade-reference")), "foreign-volume");
            }
            return { owner, volumes: volumes.map(m => m.Name),
              containers: ["check", "grade-init", "grade"].map(role => ({ role, id: byRole.get(role).id })) };
          }
          export function project(record, config, exitCode, stderr, observed) {
            ensure(observed.ready === true && observed.failed === false && observed.request, "observer-failed");
            ensure(names.includes(config.name) && uuid(config.id) &&
              ["inputHash", "evalHash", "checkerHash"].every(k => hex(config[k])), "invalid-case");
            const dir = path.join(root, "cases", config.name);
            const topology = correlate(observed.facts, observed.request, config, dir);
            ensure(record.status === "success" && record.trajectory?.id === config.id && record.gradeResult &&
              uuid(record.runId), "invalid-native-result");
            ensure(Buffer.byteLength(stderr) <= 65536 && !/cleanup|teardown|timed out|interrupted/i.test(stderr), "native-error");
            let visited = 0, programs = [];
            const visit = (value, depth = 0) => {
              ensure(++visited <= 128 && depth <= 8, "traversal-limit");
              if (value && typeof value === "object") {
                if (value.metadata?.program !== undefined) {
                  ensure(value.metadata.program === "node", "unexpected-program"); programs.push(value);
                }
                for (const item of Object.values(value)) visit(item, depth + 1);
              }
            };
            visit(record.gradeResult); ensure(programs.length === 1, "invalid-program");
            const result = programs[0], meta = result.metadata;
            ensure(JSON.stringify(meta.args) === JSON.stringify(config.args) && meta.timeout === "30s" && result.kind === "code" &&
              [meta.stdout, meta.stderr].every(v => typeof v === "string" && Buffer.byteLength(v) <= 65536), "invalid-program");
            const positive = config.name === "positive";
            if (positive) {
              ensure(exitCode === 0 && (!Object.hasOwn(meta, "exit_code") || meta.exit_code === 0) &&
                result.passed === true && result.score === 1 && result.name === "protected-input-probe" &&
                result.status !== "error" && meta.stderr === "protected-input-checker-entered\n", "positive-failed");
              const verdict = JSON.parse(meta.stdout), evidence = JSON.parse(verdict.evidence);
              ensure(Object.keys(verdict).sort().join() === ["name", "kind", "passed", "score", "evidence"].sort().join() &&
                verdict.name === result.name && verdict.kind === "code" && verdict.passed === true && verdict.score === 1 &&
                result.evidence === verdict.evidence &&
                Object.keys(evidence).length === keys.length && keys.every(k => evidence[k] === true), "invalid-verdict");
            } else {
              ensure(exitCode === 1 && meta.exit_code === 1 && result.passed === false && result.score === 0 && result.name === "program" &&
                meta.stdout === "" && meta.stderr === "protected-input-failure:trusted-integrity-mismatch\n", "negative-failed");
            }
            return { name: config.name, status: "passed", nativePassed: positive, expectedRejection: !positive,
              nativeCliExit: exitCode, nativeProgramExit: Object.hasOwn(meta, "exit_code") ? meta.exit_code : null,
              proof: positive ? Object.fromEntries(keys.map(k => [k, true])) : { trustedIntegrityMismatch: true, checkerBodyEntered: false },
              nativeRunId: record.runId, inputId: config.id, inputHash: config.inputHash, evalHash: config.evalHash,
              checkerHash: config.checkerHash, mountsCorrelated: true, nativeCleanupComplete: false, ...topology };
          }
          export async function observe(dir) {
            const state = { ready: false, failed: false, facts: [], request: null };
            const file = path.join(dir, "observation.json");
            const volumeCache = new Map();
            const anchor = bounded(path.join(root, "raw/grade-id")).toString().trim();
            ensure(/^[a-f0-9]{64}$/.test(anchor), "invalid-anchor");
            const previous = new Set(names.slice(0, names.indexOf(path.basename(dir))).flatMap(name => {
              const prior = read(path.join(root, "cases", name, "observation.json"));
              ensure(prior.facts.length === 3 && prior.facts.every(f => hex(f.id)), "invalid-history"); return prior.facts.map(f => f.id);
            }));
            let response, stopping = false, count = 0, buffer = "";
            const persist = () => save(file, state);
            const fail = () => { clearTimeout(timer); state.failed = true; persist(); process.exitCode = 1; request.destroy(); response?.destroy(); };
            const filters = JSON.stringify({ type: ["container"], image: [process.env.IMAGE] });
            const since = bounded(path.join(root, "raw/events-since")).toString().trim();
            ensure(/^\d{10}$/.test(since), "invalid-anchor");
            const request = http.get({ socketPath: "/var/run/docker.sock", path: `/events?since=${since}&filters=${encodeURIComponent(filters)}` });
            const timer = setTimeout(fail, 10000);
            request.on("error", () => { if (!stopping) fail(); });
            request.on("response", stream => {
              response = stream;
              if (stream.statusCode !== 200) { fail(); return; }
