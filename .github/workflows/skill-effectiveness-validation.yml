name: Temporary offered-tool SDK model-free verification
on:
  push:
    branches: [automation/skill-effectiveness-validation-20261017]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'dmavroeid/hve-core' && github.ref == 'refs/heads/automation/skill-effectiveness-validation-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: .github/skills/hve-core/skill-effectiveness
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
      - name: Restore frozen SDK stack
        timeout-minutes: 4
        run: |
          set -euo pipefail
          node ../../../validation/skill-effectiveness/containment-identity.mjs
          npm ci --ignore-scripts --include=dev --no-audit --no-fund --fetch-retries=0 --fetch-timeout=60000
      - name: Verify actual offered-tool denial with positive control
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offered-sdk-d68/home" "$RUNNER_TEMP/offered-sdk-d68/tmp"
          timeout --signal=TERM --kill-after=10s 180s env -i \
            PATH="$PATH" HOME="$RUNNER_TEMP/offered-sdk-d68/home" TMPDIR="$RUNNER_TEMP/offered-sdk-d68/tmp" \
            RUNNER_TEMP="$RUNNER_TEMP" CI=1 DO_NOT_TRACK=1 VALLY_TELEMETRY_OPTOUT=1 \
            node ../../../validation/skill-effectiveness/offered-sdk-run.mjs
          git diff --exit-code -- .
      - name: Upload structural offered-tool results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skill-effectiveness-offered-sdk-d68
          path: ${{ runner.temp }}/offered-sdk-d68/safe/summary.json
          if-no-files-found: error
          retention-days: 14
