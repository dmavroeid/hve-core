name: Frozen qs compatibility check
on:
  push:
    branches: [automation/skill-effectiveness-validation-20261017]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'dmavroeid/hve-core' && github.ref == 'refs/heads/automation/skill-effectiveness-validation-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DO_NOT_TRACK: '1'
      VALLY_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout unchanged source snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
      - name: Apply trial pin only in the disposable runner checkout
        run: |
          set -euo pipefail
          mkdir -p qs-compatibility-result/contribution/assets qs-compatibility-result/evidence
          cp .github/skills/hve-core/skill-effectiveness/package-lock.json "$RUNNER_TEMP/contribution-original-lock.json"
          cp .evidence-preflight/package-lock.json "$RUNNER_TEMP/evidence-original-lock.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const file of [
            ".github/skills/hve-core/skill-effectiveness/package.json",
            ".github/skills/hve-core/skill-effectiveness/assets/package.template.json",
            ".evidence-preflight/package.json",
          ]) {
            const value = JSON.parse(fs.readFileSync(file, "utf8"));
            value.overrides.qs = "6.16.0";
            fs.writeFileSync(file, JSON.stringify(value, null, 2) + "\n");
          }
          NODE
      - name: Generate trial locks from canonical public npm and verify graph delta
        timeout-minutes: 4
        run: |
          set -euo pipefail
          for package in .github/skills/hve-core/skill-effectiveness .evidence-preflight; do
            (cd "$package" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --fetch-retries=0 --fetch-timeout=60000)
          done
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const locations = {
            contribution: ".github/skills/hve-core/skill-effectiveness",
            evidence: ".evidence-preflight",
          };
          for (const [name, directory] of Object.entries(locations)) {
            const original = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}-original-lock.json`));
            const current = JSON.parse(fs.readFileSync(`${directory}/package-lock.json`));
            const paths = [...new Set([...Object.keys(original.packages), ...Object.keys(current.packages)])].sort();
            const changed = paths.filter(path => original.packages[path]?.version !== current.packages[path]?.version);
            assert.deepEqual(changed, ["node_modules/qs"]);
            assert.equal(original.packages["node_modules/qs"].version, "6.16.1");
            assert.equal(current.packages["node_modules/qs"].version, "6.16.0");
            for (const [path, entry] of Object.entries(current.packages)) {
              if (!path) continue;
              assert.equal(new URL(entry.resolved).origin, "https://registry.npmjs.org", path);
              assert.match(entry.integrity, /^sha512-/, path);
            }
            fs.copyFileSync(`${directory}/package.json`, `qs-compatibility-result/${name}/package.json`);
            fs.copyFileSync(`${directory}/package-lock.json`, `qs-compatibility-result/${name}/package-lock.json`);
            fs.writeFileSync(`qs-compatibility-result/${name}/lock-delta.json`,
              JSON.stringify({ changedVersions: changed, from: "6.16.1", to: "6.16.0" }, null, 2) + "\n");
          }
          fs.copyFileSync(".github/skills/hve-core/skill-effectiveness/assets/package.template.json",
            "qs-compatibility-result/contribution/assets/package.template.json");
          NODE
      - name: Restore and test contribution with the trial frozen lock
        working-directory: .github/skills/hve-core/skill-effectiveness
        timeout-minutes: 4
        run: |
          set -euo pipefail
          unset SKILL_EFFECTIVENESS_NATIVE_PREFLIGHT SKILL_EVAL_INVENTORY_DIR NODE_OPTIONS NODE_TEST_CONTEXT
          npm ci --ignore-scripts --include=dev --no-audit --no-fund --fetch-retries=0 --fetch-timeout=60000
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/qs-compatibility-result/contribution-tests.log"
      - name: Restore and test standalone evidence with the trial frozen lock
        working-directory: .evidence-preflight
        timeout-minutes: 4
        env:
          CATALOG_PYTHON: python3
        run: |
          set -euo pipefail
          unset SKILL_EFFECTIVENESS_NATIVE_PREFLIGHT SKILL_EVAL_INVENTORY_DIR NODE_OPTIONS NODE_TEST_CONTEXT
          npm ci --ignore-scripts --include=dev --no-audit --no-fund --fetch-retries=0 --fetch-timeout=60000
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/qs-compatibility-result/evidence-tests.log"
          node --test validation/catalog-controls.mjs 2>&1 | tee "$GITHUB_WORKSPACE/qs-compatibility-result/catalog-controls.log"
      - name: Set up exact uv for existing trusted notebook controls
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.10.9'
          enable-cache: false
      - name: Restore existing frozen Python environment and execute notebook controls
        working-directory: .evidence-preflight
        timeout-minutes: 5
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          (cd validation/python-runtime && uv sync --frozen --python "$(command -v python3)" && uv run --frozen python -m ipykernel install --prefix "$PWD/.venv" --name hve-simplified-pilot --display-name "Trusted notebook control")
          source validation/python-runtime/.venv/bin/activate
          unset SKILL_EFFECTIVENESS_NATIVE_PREFLIGHT SKILL_EVAL_INVENTORY_DIR NODE_OPTIONS NODE_TEST_CONTEXT
          export QUEUE_DELAY_NOTEBOOK_PYTHON="$PWD/validation/python-runtime/.venv/bin/python"
          export QUEUE_DELAY_NOTEBOOK_KERNEL=hve-simplified-pilot
          export MPLBACKEND=Agg
          node --test validation/notebook-controls.mjs 2>&1 | tee "$GITHUB_WORKSPACE/qs-compatibility-result/notebook-controls.log"
      - name: Retain trial public locks and compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qs-compatibility
          path: qs-compatibility-result
          retention-days: 7
          if-no-files-found: error
