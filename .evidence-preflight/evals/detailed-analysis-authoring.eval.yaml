name: queue-delay-notebook
description: Exploratory notebook and summary for investigating fleet-charging
  queue delays without overclaiming maintenance causality
version: 1.0.0
type: capability
defaults:
  runs: 1
  timeout: 75m
  executor:
    name: restricted-copilot-sdk
    config:
      sessionPolicy:
        availableTools: []
        permissions:
          allow: []
          deny: []
  model: ${AGENT_MODEL=MUST-SET-AGENT-MODEL}
agent_environment:
  env:
    DO_NOT_TRACK: "1"
  skills: []
  files:
    - src: ../fixtures/detailed-analysis-authoring/public
      dest: task-fixture
scoring: {}
stimuli:
  - name: queue-delay-notebook
    constraints:
      max_agent_duration: 20m
      max_duration: 75m
    artifacts:
      include:
        - deliverable/**
    prompt: >
      Create an exploratory analysis for a fleet-charging operations lead using
      only the supplied public files in `task-fixture`.


      User need:

      - Determine where the team should investigate queue delays first.

      - Explain what evidence is still insufficient to recommend a maintenance
      change.


      Required deliverables:

      1. Save an executable Jupyter notebook to
      `deliverable/queue-delay-analysis.ipynb`.

      2. Save a concise written summary for the operations lead to
      `deliverable/summary.md`.

      3. Save PNG copies of every substantive chart to `deliverable/figures/`
      for visual review. Choose the number and chart types needed for the
      analysis; no fixed heading sequence or chart count is required.


      Use the supplied `sessions.csv`, `profile.json`, `BRIEF.txt`, and
      `PROVENANCE.json`.

      Base conclusions only on the supplied synthetic observational data and its
      stated limitations.

      Use relative paths inside the notebook; do not rely on absolute
      machine-specific locations or live services.

      Python with pandas, numpy, matplotlib, seaborn, nbformat, nbconvert, and
      the `hve-simplified-pilot` Jupyter kernel is installed. Read
      `task-fixture/TOOLS.txt` for tool configuration.

      Do not start other agents or paid model sessions, access external
      implementations, or inspect enclosing directories or other runs. Use only
      the staged inputs and approved tools.


      The notebook should make it easy to inspect the analysis question, data
      loading, quality checks, distributions, relationships, time trends,
      outliers, conclusions, and next steps, but you may implement that
      structure in any reasonable way.


      Public checks run:

      `node task-fixture/check-notebook.mjs
      deliverable/queue-delay-analysis.ipynb deliverable/summary.md`
    graders:
      - type: completed
      - type: file-exists
        name: notebook-delivery
        config:
          path: deliverable/queue-delay-analysis.ipynb
      - type: file-exists
        name: summary-delivery
        config:
          path: deliverable/summary.md
