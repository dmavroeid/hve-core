name: dab-c4-architecture-pack
description: Create a source-grounded C4 architecture pack for Azure Data API
  builder from a bounded source bundle.
version: 1.0.0
type: capability
defaults:
  runs: 1
  timeout: 60m
  executor:
    name: restricted-copilot-sdk
    config:
      sessionPolicy:
        availableTools: []
        permissions:
          allow: []
          deny: []
  model: ${AGENT_MODEL=MUST-SET-AGENT-MODEL}
agent_environment:
  env:
    DO_NOT_TRACK: "1"
  skills: []
  files:
    - src: ../fixtures/detailed-c4-architecture/public
      dest: task-fixture
scoring: {}
stimuli:
  - name: dab-c4-architecture-pack
    constraints:
      max_agent_duration: 20m
      max_duration: 60m
    artifacts:
      include:
        - deliverable/**
    prompt: >
      You are helping a new engineer understand Azure Data API builder from a
      bounded public source bundle.


      Use only the files under `task-fixture\source` plus the provenance/tool
      notes in `task-fixture`.

      Reconcile code, configuration, project dependencies, and deployment
      artifacts rather than paraphrasing the README.


      Save one Markdown document to `deliverable\architecture-pack.md` that
      includes:


      - a short onboarding-oriented overview

      - one Mermaid legend

      - one System Context diagram

      - one Container diagram

      - one Component diagram for the HTTP service/runtime path that handles an
      authenticated SQL Server-backed REST read

      - one Deployment diagram for the evidenced local Docker deployment

      - brief evidence notes with source paths for the major claims and the
      pinned provenance/commit


      The pack must explicitly:


      - explain the CLI-to-runtime configuration path

      - explain the authenticated REST read path to SQL Server

      - explain the local Docker deployment evidenced by the supplied artifacts

      - state whether the supplied sample runtime config is itself authenticated
      and, if not, where the authenticated path is implemented in code

      - keep unknowns explicit instead of inventing unsupported ownership,
      deployment, or authentication claims


      Use renderable Mermaid flowcharts. Public checks render the Mermaid blocks
      and run:

      `node task-fixture/check.mjs deliverable/architecture-pack.md`


      Include exactly five Mermaid code blocks in this order: legend, System
      Context,

      Container, Component, Deployment. Headings, diagram directions and node
      IDs

      are your choice. The checker retains PNG images under
      `deliverable/rendered`.

      Content correctness and visual usefulness are assessed separately from
      rendering.


      Approved local tool paths are listed in `task-fixture/TOOLS.txt`.
    graders:
      - type: completed
      - type: file-exists
        name: delivery
        config:
          path: deliverable/architecture-pack.md
