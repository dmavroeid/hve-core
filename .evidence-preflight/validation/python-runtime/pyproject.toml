[project]
name = "skill-effectiveness-notebook-controls"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel==6.30.1",
    "ipywidgets==8.1.7",
    "matplotlib==3.10.6",
    "nbconvert==7.16.6",
    "nbformat==5.10.4",
    "numpy==2.3.3",
    "pandas==2.3.2",
    "pillow==11.3.0",
    "pytest==8.4.2",
    "ruff==0.13.1",
    "seaborn==0.13.2",
    "tqdm==4.67.1",
]

[tool.uv]
constraint-dependencies = [
    "platformdirs==4.13.0",
    "pluggy==1.6.0",
    "fonttools==4.66.1",
    "mistune==3.3.4",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"
